<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f5f9">
<style>
:root{color-scheme:light;--bg:#f1f5f9;--panel:#ffffff;--line:#dbe3ee;--txt:#0f172a;--mut:#64748b;--acc:#f5b301;--err:#dc2626;--ok:#15803d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:max(1rem,env(safe-area-inset-top)) 1rem max(1rem,env(safe-area-inset-bottom))}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:1.5rem;box-shadow:0 12px 40px rgba(15,23,42,.10)}
.logo{display:flex;align-items:center;gap:.75rem;margin-bottom:1.2rem}
.badge{width:46px;height:46px;border-radius:12px;background:var(--acc);color:#1a1300;display:grid;place-items:center;font-size:1.5rem;flex:none}
h1{font-size:1.05rem;margin:0;line-height:1.25}h1 small{display:block;color:var(--mut);font-weight:400;font-size:.78rem;margin-top:2px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);background:#f4f7fb;border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:1.1rem}
.seg button{border:0;background:none;color:var(--mut);padding:.6rem .2rem;border-radius:9px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.seg button.on{background:var(--acc);color:#1a1300}
label{display:block;font-size:.78rem;color:var(--mut);margin:.7rem 0 .3rem}
input,select,textarea{width:100%;min-height:48px;padding:.7rem .85rem;background:#f4f7fb;border:1px solid var(--line);border-radius:10px;color:var(--txt);font:inherit;font-size:16px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
.pw{position:relative}.pw button{position:absolute;right:4px;top:4px;height:40px;width:44px;border:0;background:none;color:var(--mut);font-size:1.1rem;cursor:pointer}
.go{width:100%;min-height:50px;margin-top:1.1rem;border:0;border-radius:11px;background:var(--acc);color:#1a1300;font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.go:disabled{opacity:.6}
.msg{margin:.2rem 0 .6rem;padding:.65rem .8rem;border-radius:10px;font-size:.88rem;display:none}
.msg.err{display:block;background:rgba(220,38,38,.10);color:var(--err)}.msg.ok{display:block;background:rgba(21,128,61,.10);color:var(--ok)}
.hint{color:var(--mut);font-size:.76rem;text-align:center;margin:1rem 0 0}
.hide{display:none!important}
.dsk{display:none}@media(min-width:560px){.dsk{display:inline}}
.home h2{margin:.2rem 0 .3rem}.home p{color:var(--mut);line-height:1.5}
.role{display:inline-block;background:rgba(245,179,1,.15);color:var(--acc);padding:.2rem .7rem;border-radius:99px;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.out{background:none;border:1px solid var(--line);color:var(--txt);min-height:46px;width:100%;border-radius:11px;font:inherit;font-weight:600;cursor:pointer;margin-top:1rem}

#app{max-width:980px;margin:0 auto;padding:max(.8rem,env(safe-area-inset-top)) .8rem 2rem}
.top{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem}.top b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:.6rem;margin-bottom:1rem}
.st{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.9rem}.st span{color:var(--mut);font-size:.78rem}.st strong{display:block;font-size:1.7rem;color:var(--acc)}
.tabs{display:flex;gap:.4rem;overflow-x:auto;margin-bottom:.8rem;scrollbar-width:none}.tabs button{white-space:nowrap;border:1px solid var(--line);border-radius:99px;background:var(--panel);color:var(--txt);padding:.5rem .95rem;font:inherit;cursor:pointer}.tabs button.on{background:var(--acc);color:#1a1300;border-color:var(--acc)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:1rem}.box h3{margin:0 0 .5rem;font-size:1rem}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:600px}th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600}
img.th{width:44px;height:44px;object-fit:cover;border-radius:8px;display:block}
.sm{min-height:38px;padding:.3rem .9rem;border-radius:9px;border:1px solid var(--line);background:none;color:var(--txt);font:inherit;cursor:pointer}
.row{display:flex;gap:.5rem;margin-bottom:.7rem}.row>*{flex:1}.row .sm{flex:none}
.pill{padding:.15rem .6rem;border-radius:99px;font-size:.75rem;background:rgba(21,128,61,.12);color:var(--ok)}.pill.x{background:rgba(220,38,38,.10);color:var(--err)}
.li{padding:.55rem 0;border-bottom:1px solid var(--line);font-size:.9rem}.li small{color:var(--mut)}
.chat{height:55vh;min-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:.45rem}
.m{max-width:84%;padding:.5rem .75rem;border-radius:14px;background:#e8eef6;align-self:flex-start;overflow-wrap:anywhere}
.m.me{background:var(--acc);color:#1a1300;align-self:flex-end}.m small{display:block;font-size:.7rem;opacity:.7;margin-bottom:2px}
.cin{display:flex;gap:.5rem;margin-top:.7rem}.cin input{flex:1}.cin .go{width:auto;margin:0;padding:0 1.2rem}
.xg{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.xb{flex:1 1 calc(50% - .6rem);min-height:48px;padding:.5rem 1rem;border-radius:10px;background:var(--panel);font:inherit;font-weight:700;cursor:pointer}
.xb.x{border:1px solid #198754;color:#198754}.xb.p{border:1px solid #dc3545;color:#dc3545}.xb:disabled{opacity:.55}
@media(min-width:760px){.xb{flex:0 0 auto}}
.av{width:88px;height:88px;border-radius:50%;background:var(--acc);color:#1a1300;display:grid;place-items:center;font-size:2.2rem;font-weight:700;overflow:hidden;position:relative;flex:none}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avrow{display:flex;align-items:center;gap:1rem;margin:.5rem 0 .9rem}
.burger{font-size:1rem;font-weight:600;padding:.3rem .9rem;flex:none;white-space:nowrap}.mob{display:none}
@media(max-width:759px){.tabs{display:none}.tabs.keep{display:flex}.dkb{display:none}#who{display:none}.mob{display:block;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.95rem}.top .badge{display:none}}
@media(min-width:760px){.burger{display:none}}
#dr{position:fixed;inset:0;z-index:40}.dback{position:absolute;inset:0;background:rgba(15,23,42,.45)}
.dpanel{position:absolute;left:0;top:0;bottom:0;width:80%;max-width:320px;background:var(--panel);padding:max(1rem,env(safe-area-inset-top)) .9rem 1rem;overflow-y:auto;box-shadow:6px 0 30px rgba(15,23,42,.2);display:flex;flex-direction:column;gap:.25rem;animation:slin .18s ease-out}
@keyframes slin{from{transform:translateX(-100%)}to{transform:none}}
.dhead{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem}.dhead b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbtn{display:block;width:100%;text-align:left;min-height:48px;padding:.6rem .9rem;border:0;border-radius:11px;background:none;color:var(--txt);font:inherit;font-size:1rem;cursor:pointer}
.dbtn:active{background:#eef2f7}.dbtn.on{background:var(--acc);color:#1a1300;font-weight:700}.dsep{height:1px;background:var(--line);margin:.5rem 0}
.cimg{display:block;width:220px;max-width:100%;min-height:60px;border-radius:10px;margin:4px 0;background:#e2e8f0}
.clip{display:inline-flex;align-items:center;justify-content:center;gap:.3rem;padding:0 .9rem!important;margin:0;cursor:pointer;font-size:.92rem;font-weight:600;white-space:nowrap;flex:none}
.cprev{display:flex;align-items:center;gap:.6rem;margin-top:.6rem;padding:.4rem;border:1px dashed var(--line);border-radius:10px}.cprev img{width:48px;height:48px;object-fit:cover;border-radius:8px}.cprev span{flex:1;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm.on{background:var(--acc);color:#1a1300;border-color:var(--acc);font-weight:700}
@media(min-width:760px){
  #app{max-width:1200px;padding-top:max(1rem,env(safe-area-inset-top))}
  .tabs{flex-wrap:wrap;overflow:visible;gap:.3rem;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.4rem;margin-bottom:1rem}
  .tabs button{border-color:transparent;background:transparent;border-radius:10px;padding:.55rem .95rem;font-size:.93rem;font-weight:600}
  .tabs button:hover{background:#eef2f7}.tabs button.on:hover{background:var(--acc)}
  .tabs .push{margin-left:auto}.tabs .tg{color:var(--mut);font-weight:500}
}
.rq{display:none;color:var(--err);font-weight:700}#f.su .rq{display:inline}.bad{border-color:var(--err)!important}
.pbar{height:14px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:.9rem 0 .4rem}.pbar i{display:block;height:100%;width:0;background:var(--acc);border-radius:99px;transition:width .25s}
</style>
</head>
<body>
<div class="wrap"><div class="card">

  <div class="logo"><div class="badge">🛡️</div><h1>Sistem Absensi Security<small>Absensi · Patroli · Laporan</small></h1></div>

  <!-- AUTH -->
  <div id="auth">
    <div class="seg" id="seg">
      <button class="on" data-m="login">Login</button>
      <button data-m="signup">Daftar</button>
    </div>
    <div id="msg" class="msg"></div>

    <form id="f" autocomplete="on" novalidate>
      <div id="rowNama" class="hide"><label>Nama lengkap<span class="rq"> *</span></label><input id="nama" autocomplete="name"></div>
      <label>Username<span class="rq"> *</span></label><input id="user" autocomplete="username" autocapitalize="none" required>
      <label>Password<span class="rq"> *</span></label>
      <div class="pw"><input id="pass" type="password" autocomplete="current-password" required><button type="button" id="eye" aria-label="Tampilkan password">👁</button></div>
      <div id="rowExtra" class="hide">
        <label>No. HP (1 nomor = 1 akun)<span class="rq"> *</span></label><input id="hp" inputmode="tel" autocomplete="tel" placeholder="cth: 0812 3456 7890">
        <label>Lokasi tugas<span class="rq"> *</span></label><select id="lokasi"><option value="">— Pilih lokasi tugas —</option></select>
      </div>
      <button class="go" id="go" type="submit">Masuk</button>
    </form>
    <p class="hint" id="hint">Daftar hanya untuk akun Security. Admin cukup login dengan akun yang sudah dibuat pengelola.</p>
  </div>


</div></div>

<div id="app" class="hide"><div class="top"><button class="sm burger" onclick="menu(true)" aria-label="Buka menu">☰ Menu</button><span class="badge" style="width:38px;height:38px;font-size:1.2rem">🛡️</span><b id="who"></b><b id="cur" class="mob"></b><button class="sm dkb" onclick="openPw()" aria-label="Ubah kata sandi">🔑 <span class="dsk">Ubah Sandi</span></button><button class="sm dkb" onclick="doLogout()">Keluar</button></div><div id="note" class="msg"></div><div id="main"></div></div>

<div id="dr" class="hide">
  <div class="dback" onclick="menu(false)"></div>
  <nav class="dpanel">
    <div class="dhead"><b id="dwho"></b><button class="sm" onclick="menu(false)" aria-label="Tutup menu">✕</button></div>
    <div id="dlist"></div>
    <div class="dsep"></div>
    <button class="dbtn" onclick="menu(false);openPw()">🔑 Ubah Sandi</button>
    <button class="dbtn" onclick="menu(false);doLogout()">🚪 Keluar</button>
  </nav>
</div>

<div id="upBox" class="hide" style="position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:1rem">
  <div class="card" style="max-width:340px;text-align:center">
    <div id="upIc" style="font-size:2.2rem">⏳</div>
    <h1 id="upTit" style="font-size:1.05rem;margin:.3rem 0 .2rem">Mengirim...</h1>
    <p id="upTxt" style="color:var(--mut);font-size:.88rem;margin:0">Tunggu proses…</p>
    <div class="pbar"><i id="upBar"></i></div>
    <b id="upPct" style="font-size:1.3rem">0%</b>
    <button class="go hide" id="upOk" onclick="UP.close()">Tutup</button>
  </div>
</div>

<div id="pwBox" class="hide" style="position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem">
  <div class="card" style="max-width:380px">
    <h1 style="margin-bottom:.6rem">🔑 Ubah Kata Sandi</h1>
    <div id="pwMsg" class="msg"></div>
    <form id="pwForm" autocomplete="off">
      <label>Kata sandi lama</label><input id="pwOld" type="password" autocomplete="current-password" required>
      <label>Kata sandi baru (min. 6 karakter)</label><input id="pwNew" type="password" autocomplete="new-password" minlength="6" required>
      <label>Ulangi kata sandi baru</label><input id="pwNew2" type="password" autocomplete="new-password" required>
      <button class="go" id="pwGo" type="submit">Simpan</button>
      <button class="out" type="button" onclick="closePw()" style="width:100%;min-height:46px;margin-top:.6rem;background:none;border:1px solid var(--line);color:var(--txt);border-radius:11px;font:inherit;font-weight:600;cursor:pointer">Batal</button>
    </form>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
// Pilihan lokasi tugas (harus sama dengan daftar di Code.gs)
const LOKASI = [
  "SPPG - Karangmulya (Suradadi)",
  "SPPG - Karangjati (Tarub)",
  "SPPG - Tegalwangi (Talang)",
  "SPPG - Pagongan (Dukuhturi)",
  "SPPG - Blubuk (Dukuhwaru)",
  "SPPG - Rembul (Bojong)",
  "SPPG - Pandansari (Bumijawa)",
  "SPPG - Margasari (Margasari)",
  "SPPG - Ketanggungan (Ketanggungan)",
  "SPPG - Banjarlor (Banjarharjo)",
  "SPPG - Kedawung (Tanjung)",
  "SPPG - Kecipir (Tanjung)",
  "SPPG - Pakijangan (Bulakamba)",
  "SPPG - Benda (Sirampog)",
  "SPPG - Pakiringan (Bantarkawung)"
];
$('lokasi').insertAdjacentHTML('beforeend', LOKASI.map(x => `<option>${x}</option>`).join(''));
let mode = 'login';
const MODES = {
  login:  { btn: 'Masuk',  signup: false, pw: 'current-password' },
  signup: { btn: 'Daftar', signup: true,  pw: 'new-password' }
};

function say(t, type) { const m = $('msg'); m.textContent = t || ''; m.className = 'msg' + (t ? ' ' + type : ''); }

function setMode(m) {
  mode = m; const c = MODES[m];
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('rowNama').classList.toggle('hide', !c.signup); $('rowExtra').classList.toggle('hide', !c.signup);
  $('nama').required = c.signup; $('hp').required = c.signup; $('lokasi').required = c.signup; $('pass').autocomplete = c.pw; $('go').textContent = c.btn;
  $('f').classList.toggle('su', c.signup); document.querySelectorAll('#f .bad').forEach(x => x.classList.remove('bad'));
  say('');
}
$('seg').onclick = e => { if (e.target.dataset.m) setMode(e.target.dataset.m); };
$('eye').onclick = () => { $('pass').type = $('pass').type === 'password' ? 'text' : 'password'; };

function run(fn, args, ok) {
  const b = $('go'), t = b.textContent; b.disabled = true; b.textContent = 'Memproses...';
  rpc(fn, ...args)
    .then(r => { b.disabled = false; b.textContent = t; ok(r); })
    .catch(e => { b.disabled = false; b.textContent = t; say('Terjadi kesalahan: ' + e.message, 'err'); });
}

['nama', 'user', 'pass', 'hp', 'lokasi'].forEach(id => { $(id).addEventListener('input', () => $(id).classList.remove('bad')); $(id).addEventListener('change', () => $(id).classList.remove('bad')); });
function cek(daftar) {   // daftar: [[idInput, label, pesanTambahan?]] → true bila semua valid
  document.querySelectorAll('#f .bad').forEach(x => x.classList.remove('bad'));
  const kosong = daftar.filter(x => !$(x[0]).value.trim());
  if (kosong.length) { kosong.forEach(x => $(x[0]).classList.add('bad')); $(kosong[0][0]).focus(); say('Wajib diisi: ' + kosong.map(x => x[1]).join(', ') + '.', 'err'); return false; }
  return true;
}
$('f').onsubmit = e => {
  e.preventDefault(); say('');
  const u = $('user').value.trim(), p = $('pass').value;
  if (mode === 'signup') {
    if (!cek([['nama', 'Nama lengkap'], ['user', 'Username'], ['pass', 'Password'], ['hp', 'No. HP'], ['lokasi', 'Lokasi tugas']])) return;
    if (!/^[A-Za-z0-9_.]{3,20}$/.test(u)) { $('user').classList.add('bad'); $('user').focus(); return say('Username 3–20 karakter: huruf, angka, titik, atau garis bawah.', 'err'); }
    if (p.length < 6) { $('pass').classList.add('bad'); $('pass').focus(); return say('Password minimal 6 karakter.', 'err'); }
    const dg = $('hp').value.replace(/\D/g, '').replace(/^62/, '').replace(/^0+/, '');
    if (dg.length < 9 || dg.length > 13 || !/^[0-9+ \-]+$/.test($('hp').value.trim())) { $('hp').classList.add('bad'); $('hp').focus(); return say('No. HP tidak valid. Contoh: 0812 3456 7890.', 'err'); }
    run('signup', [{ nama: $('nama').value.trim(), username: u, password: p, no_hp: $('hp').value.trim(), lokasi_tugas: $('lokasi').value }], r => {
      if (r.ok) { $('f').reset(); setMode('login'); say(r.message, 'ok'); } else say(r.message, 'err');
    });
  } else {
    if (!cek([['user', 'Username'], ['pass', 'Password']])) return;
    run('login', [u, p], r => {
      if (!r.ok) return say(r.message, 'err');
      TOK = r.token; try { sessionStorage.setItem('tok', TOK); } catch (_) {}
      showApp(r.user);
    });
  }
};

let TOK = '', USER = null, D = null, tab = 'absensi';
// ====== GANTI dengan URL Web App Apps Script Anda (berakhiran /exec) ======
const API = 'https://script.google.com/macros/s/AKfycbxcy8I52LDHaBqIVd7NTx5CAAZ_dpnKex3v-9K2VRrt6IsB-iH4vMiitd5jROBn3PcS/exec';
// text/plain agar browser tidak mengirim preflight CORS
const rpc = (fn, ...a) => fetch(API, { method: 'POST', body: JSON.stringify({ fn: fn, args: a }) })
  .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.error); return j.data; });
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function note(t, type) { const n = $('note'); n.textContent = t || ''; n.className = 'msg' + (t ? ' ' + type : ''); if (t) scrollTo(0, 0); }
function fail(e) { if (/Sesi berakhir/.test(e.message)) return doLogout(); note(e.message, 'err'); }

// Kirim dengan XHR agar kemajuan unggah (%) bisa dibaca
const rpcUp = (fn, args, onUp) => new Promise((ok, no) => {
  const x = new XMLHttpRequest(); x.open('POST', API); x.timeout = 180000;
  x.upload.onprogress = e => { if (e.lengthComputable) onUp(e.loaded / e.total); };
  x.upload.onload = () => onUp(1);
  x.onerror = () => no(new Error('Koneksi gagal. Periksa internet Anda lalu coba lagi.'));
  x.ontimeout = () => no(new Error('Waktu habis. Sinyal terlalu lemah, coba lagi.'));
  x.onload = () => { try { const j = JSON.parse(x.responseText); j.ok ? ok(j.data) : no(new Error(j.error)); } catch (_) { no(new Error('Respon server tidak valid.')); } };
  x.send(JSON.stringify({ fn: fn, args: args }));
});
const UP = {
  p: 0,
  open(title) { $('upIc').textContent = '⏳'; $('upTit').textContent = title; $('upOk').classList.add('hide'); $('upBar').style.background = ''; this.set(0, 'Tunggu proses, jangan tutup halaman…'); $('upBox').classList.remove('hide'); document.body.style.overflow = 'hidden'; },
  set(p, txt) { this.p = p; $('upBar').style.width = p + '%'; $('upPct').textContent = Math.round(p) + '%'; if (txt) $('upTxt').textContent = txt; },
  bump() { if (this.p < 97) this.set(this.p + 1); },
  async call(fn, ...args) {
    let creep = null;
    try {
      return await rpcUp(fn, [TOK, ...args], f => {
        this.set(15 + f * 70, f < 1 ? 'Mengunggah… tunggu proses, jangan tutup halaman' : 'Menyimpan ke server…');
        if (f >= 1 && !creep) creep = setInterval(() => this.bump(), 500);
      });
    } finally { clearInterval(creep); }
  },
  async done(msg) { this.set(100, 'Selesai'); $('upIc').textContent = '✅'; $('upTit').textContent = msg; $('upTxt').textContent = 'Data berhasil tersimpan.'; await new Promise(r => setTimeout(r, 1300)); this.close(); },
  fail(msg) { $('upIc').textContent = '❌'; $('upTit').textContent = 'Gagal mengirim'; $('upTxt').textContent = msg; $('upBar').style.background = 'var(--err)'; $('upOk').classList.remove('hide'); },
  err(e) { if (/Sesi berakhir/.test(e.message)) { this.close(); fail(e); } else this.fail(e.message); },
  close() { $('upBox').classList.add('hide'); document.body.style.overflow = ''; }
};

function menu(on) { $('dr').classList.toggle('hide', !on); document.body.style.overflow = on ? 'hidden' : ''; }
function fillMenu() {
  const admin = USER.role === 'admin';
  const items = admin
    ? Object.keys(TB).map(k => [k, TB[k].t, `adminGo('${k}')`]).concat([['chat', '💬 Obrolan', 'adminChat()'], ['reload', '↻ Muat ulang', 'loadAdmin()']])

const kirimAbsen = (b, fn) => kirim(b, fn, { shift: $('shift') ? $('shift').value : '' }, $('fa').files[0]);
const kirimLaporan = b => $('ld').value.trim() ? kirim(b, 'submitLaporan', { jenis: $('lj').value, deskripsi: $('ld').value }, $('fl').files[0], true) : note('Isi deskripsi kejadian.', 'err');
const kirimKondisi = b => $('kl').value.trim() ? kirim(b, 'submitKondisi', { lokasi: $('kl').value, catatan: $('kc').value }, $('fk').files[0]) : note('Isi nama lokasi.', 'err');
const kirimPatroli = b => $('cp').value ? kirim(b, 'submitPatroli', { checkpoint: $('cp').value, catatan: $('cat').value }, $('fp').files[0]) : note('Pilih checkpoint.', 'err');

// ---------- SECURITY: NAVIGASI, OBROLAN, PROFIL ----------
let chatTimer = null, chatLast = -1;
let secT = 'absen';
const SEC_TABS = [['absen', '📷 Absensi'], ['jadwal', '🗓️ Jadwal'], ['patroli', '🚶 Patroli'], ['laporan', '📝 Laporan'], ['kondisi', '🏢 Kondisi'], ['rekap', '📊 Rekap'], ['chat', '💬 Obrolan'], ['profil', '👤 Profil']];
function secShell() {
  $('main').innerHTML = '<div class="tabs" id="stabs">' + SEC_TABS.map(x => `<button data-t="${x[0]}" onclick="goSec('${x[0]}')">${x[1]}</button>`).join('') + '</div><div id="sbody"></div>';
  goSec('absen');
}
function goSec(t) {
  secT = t; mark(t); clearInterval(chatTimer); note('');
  document.querySelectorAll('#stabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $('sbody').innerHTML = '<p style="color:var(--mut)">Memuat...</p>';
  return ({ absen: loadAbsen, jadwal: loadJadwal, patroli: loadPatroli, laporan: loadLaporan, kondisi: loadKondisi, rekap: loadRekap, chat: openChat, profil: openProfil })[t]();
}
function openChat() {
  chatLast = -1; let pend = null;
  $('sbody').innerHTML = `<div class="box"><h3>💬 Obrolan Seluruh Security</h3><div class="chat" id="msgs"></div>
  <div id="cprev" class="cprev hide"><img id="cpi" alt=""><span id="cpn"></span><button type="button" class="sm" id="cpx" aria-label="Batalkan gambar">✕</button></div>
  <form class="cin" id="cf" autocomplete="off"><label class="sm clip" title="Kirim gambar">📎 Gambar<input type="file" id="cfile" accept="image/*" hidden></label>
  <input id="ct" maxlength="500" placeholder="Tulis pesan..."><button class="go" type="submit" id="cs">Kirim</button></form><div id="cmsg" class="msg" style="margin:.6rem 0 0"></div></div>`;
  const cnote = (t, type) => { const m = $('cmsg'); if (!m) return; m.textContent = t || ''; m.className = 'msg' + (t ? ' ' + type : ''); };
  const clear = () => { pend = null; $('cfile').value = ''; $('cprev').classList.add('hide'); };
  $('cfile').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    if (!/^image\//.test(f.type)) { clear(); return cnote('File harus berupa gambar.', 'err'); }
    cnote(''); pend = f; $('cpi').src = URL.createObjectURL(f); $('cpn').textContent = f.name; $('cprev').classList.remove('hide');
  };
  $('cpx').onclick = clear;
  $('cf').onsubmit = async e => {
    e.preventDefault(); const t = $('ct').value.trim(); if (!t && !pend) return; cnote('');
    const b = $('cs'); b.disabled = true; b.textContent = pend ? 'Mengunggah...' : 'Kirim';
    try {
      const adaFoto = !!pend; let r;
      if (adaFoto) { UP.open('Mengirim gambar…'); UP.set(5, 'Memproses gambar…'); const foto = await shot(pend); r = await UP.call('kirimPesan', t, foto); }
      else r = await rpc('kirimPesan', TOK, t, '');
      if (!r.ok) { if (adaFoto) UP.fail(r.message); else cnote(r.message, 'err'); }
      else { $('ct').value = ''; clear(); if (adaFoto) await UP.done('Gambar berhasil terkirim ✔'); }
      pollChat();
    } catch (err) { if (pend) UP.err(err); else if (/Sesi berakhir/.test(err.message)) fail(err); else cnote('Gagal mengirim: ' + err.message, 'err'); }
    b.disabled = false; b.textContent = 'Kirim';
  };
  pollChat(); chatTimer = setInterval(pollChat, 8000);
}
async function pollChat() {
  const box = $('msgs'); if (!box) return clearInterval(chatTimer); if (document.hidden) return;
  try {
    const r = await rpc('ambilPesan', TOK, chatLast);
    const first = chatLast < 0, near = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    chatLast = r.last;
    if (!r.rows.length) { if (first) { box.dataset.empty = 1; box.innerHTML = '<small style="color:var(--mut)">Belum ada pesan. Mulai obrolan!</small>'; } return; }
    if (first || box.dataset.empty) { box.innerHTML = ''; delete box.dataset.empty; }
    box.insertAdjacentHTML('beforeend', r.rows.map(m => { const me = m.uid === USER.id; return `<div class="m${me ? ' me' : ''}"><small>${me ? 'Anda' : esc(m.nama)} · ${esc(String(m.tanggal).slice(5))} ${esc(m.jam)}</small>${chatImg(m)}${esc(m.pesan)}</div>`; }).join(''));
    if (first || near) box.scrollTop = box.scrollHeight;
  } catch (e) { if (/Sesi berakhir/.test(e.message)) fail(e); }
}
function adminChat() {
  $('main').innerHTML = '<div class="tabs keep"><button onclick="clearInterval(chatTimer);loadAdmin()">← Kembali ke Dashboard</button></div><div id="sbody"></div>';
  mark('chat'); openChat();
}
async function openProfil() {
  let p; try { p = await rpc('getProfile', TOK); } catch (e) { return fail(e); }
  $('sbody').innerHTML = `<div class="box"><h3>👤 Profil Saya</h3>
  <div class="avrow"><div class="av" id="av">${thumb(p.foto) ? `<img src="${thumb(p.foto)}" alt="Foto profil" onerror="this.remove()">` : ''}<span>${esc((p.nama || '?').trim().charAt(0).toUpperCase())}</span></div>
  <div><label class="sm" style="display:inline-flex;align-items:center;margin:0;color:var(--txt);cursor:pointer"><span id="pfl">📷 Ganti Foto</span><input type="file" id="pfoto" accept="image/*" hidden></label><br><small style="color:var(--mut)">JPG/PNG, otomatis dikecilkan</small></div></div>
  <div class="stats" style="margin:.6rem 0"><div class="st"><span>Total Absensi</span><strong>${p.totalAbsen}</strong></div><div class="st"><span>Total Patroli</span><strong>${p.totalPatroli}</strong></div></div>
  <p style="color:var(--mut);font-size:.85rem;margin:.3rem 0 .6rem">Username: <b style="color:var(--txt)">${esc(p.username)}</b> · Bergabung: ${esc(p.bergabung) || '-'}</p>
  <form id="pf"><label>Nama lengkap</label><input id="pn" value="${esc(p.nama)}" maxlength="60" required>
  <label>No. HP</label><input id="ph2" value="${esc(p.hp)}" inputmode="tel" maxlength="20">
  <label>Lokasi tugas</label><select id="pl">${(LOKASI.indexOf(p.lokasi) < 0 && p.lokasi ? [p.lokasi] : []).concat(LOKASI).map(x => `<option${x === p.lokasi ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select><button class="go" type="submit">Simpan Profil</button></form>
  <button class="sm" style="width:100%;margin-top:.8rem;min-height:46px" onclick="openPw()">🔑 Ubah Kata Sandi</button></div>`;
  $('pfoto').onchange = async e => {
    const f = e.target.files[0]; if (!f) return; note(''); $('pfl').textContent = 'Mengunggah...';
    try {
      UP.open('Mengunggah foto profil…'); UP.set(5, 'Memproses foto…');
      const d = await avatar(f), r = await UP.call('uploadFotoProfil', d);
      if (!r.ok) throw new Error(r.message);
      $('av').innerHTML = `<img src="${d}" alt="Foto profil"><span></span>`;
      await UP.done('Foto profil berhasil terkirim ✔');
    } catch (err) { UP.err(err); }
    $('pfl').textContent = '📷 Ganti Foto'; e.target.value = '';
  };
  $('pf').onsubmit = async e => {
    e.preventDefault(); const b = e.target.querySelector('button'); b.disabled = true;
    try {
      const r = await rpc('updateProfile', TOK, { nama: $('pn').value, no_hp: $('ph2').value, lokasi_tugas: $('pl').value });
      if (r.ok) { USER = r.user; $('who').textContent = '🛡️ ' + USER.nama; fillMenu(); mark(secT); note('Profil tersimpan ✔', 'ok'); } else note(r.message, 'err');
    } catch (err) { fail(err); }
    b.disabled = false;
  };
}

// ---------- UBAH KATA SANDI ----------
function pwSay(t, type) { const m = $('pwMsg'); m.textContent = t || ''; m.className = 'msg' + (t ? ' ' + type : ''); }
function openPw() { $('pwForm').reset(); pwSay(''); $('pwBox').classList.remove('hide'); $('pwOld').focus(); }
function closePw() { $('pwBox').classList.add('hide'); }
$('pwForm').onsubmit = async e => {
  e.preventDefault(); pwSay('');
  if ($('pwNew').value !== $('pwNew2').value) return pwSay('Konfirmasi kata sandi baru tidak sama.', 'err');
  if ($('pwNew').value === $('pwOld').value) return pwSay('Kata sandi baru harus berbeda dari yang lama.', 'err');
  const b = $('pwGo'); b.disabled = true; b.textContent = 'Menyimpan...';
  try {
    const r = await rpc('changePassword', TOK, $('pwOld').value, $('pwNew').value);
    pwSay(r.message, r.ok ? 'ok' : 'err'); if (r.ok) $('pwForm').reset();
  } catch (err) { if (/Sesi berakhir/.test(err.message)) return doLogout(); pwSay(err.message, 'err'); }
  b.disabled = false; b.textContent = 'Simpan';
};

(function () {
  try { TOK = sessionStorage.getItem('tok') || ''; } catch (_) {}
  if (TOK) rpc('me', TOK).then(u => { if (u) showApp(u); }).catch(() => {});
})();
setMode('login');
</script>
</body>
</html>
